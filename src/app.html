<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Русский: пит-стоп</title>
<style>
  :root{
    color-scheme:light;
    --bg:#f5f7fa; --panel:#ffffff; --panel2:#eef1f6; --line:#d7dee7;
    --txt:#151d28; --dim:#5c6a7c; --amber:#ffb020; --green:#1a7f37;
    --red:#c4282f; --blue:#2563eb; --purple:#7c3aed;
    --amberInk:#8f5300; --btnInk:#3d2800;
    --track:#e2e8f0; --dot:#aab5c3;
    --okBg:#e7f4ec; --okBorder:#9ad2ad; --goodBg:#cdedd9;
    --noBg:#fdeaeb; --noBorder:#eda6aa; --hitBg:#f9d6d8;
    --amberBg:#fff5e1; --amberBorder:#f0cb83; --purpleBg:#f0eafd;
    --shadow:0 1px 2px rgba(21,29,40,.06), 0 1px 8px rgba(21,29,40,.04);
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2b3444;
    --txt:#e6edf3; --dim:#8b98a9; --amber:#ffb020; --green:#2ea043;
    --red:#e5484d; --blue:#3b82f6; --purple:#a371f7;
    --amberInk:#ffb020; --btnInk:#1a1200;
    --track:#232b38; --dot:#38424f;
    --okBg:rgba(46,160,67,.14); --okBorder:rgba(46,160,67,.45); --goodBg:rgba(46,160,67,.2);
    --noBg:rgba(229,72,77,.14); --noBorder:rgba(229,72,77,.45); --hitBg:rgba(229,72,77,.22);
    --amberBg:rgba(255,176,32,.1); --amberBorder:rgba(255,176,32,.28); --purpleBg:rgba(163,113,247,.13);
    --shadow:none;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:20px 18px 80px}
  h1{font-size:23px;margin:0;letter-spacing:-.3px}
  h2{font-size:19px;margin:0 0 12px}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;transition:.12s}
  button:active{transform:translateY(1px)}
  .muted{color:var(--dim);font-size:14px}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;
    padding:14px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px;gap:12px}
  .logo{display:flex;align-items:center;gap:11px}
  .flag{width:34px;height:34px;border-radius:9px;background:
    repeating-conic-gradient(#ffffff 0 25%, #141a22 0 50%) 0 0/12px 12px;
    border:2px solid var(--amber);flex:none}
  .streak{background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:6px 14px;font-size:14px;font-weight:600;white-space:nowrap}

  /* cards / panels */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:27px;line-height:1.2;font-family:ui-monospace,monospace}
  .stat span{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}

  .btn{background:var(--amber);color:var(--btnInk);padding:15px 20px;font-weight:700;
    width:100%;font-size:17px;margin-bottom:10px}
  .btn:hover{filter:brightness(1.08)}
  .btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line);font-weight:600}
  .btn.sm{width:auto;padding:9px 16px;font-size:15px}

  /* rule map */
  .map{display:flex;flex-direction:column;gap:9px}
  .maprow{display:flex;align-items:center;gap:12px;cursor:pointer;padding:4px 2px;border-radius:8px}
  .maprow:hover{background:var(--panel2)}
  .maprow .nm{flex:1;font-size:15px}
  .bar{width:130px;height:8px;background:var(--track);border-radius:4px;overflow:hidden;flex:none}
  .bar i{display:block;height:100%;background:var(--green);border-radius:4px}
  .pct{width:42px;text-align:right;font-size:13px;color:var(--dim);
    font-family:ui-monospace,monospace;flex:none}

  /* session */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .prog{flex:1;height:6px;background:var(--track);border-radius:3px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--amber);transition:.3s}
  .xbtn{background:none;color:var(--dim);font-size:22px;padding:0 6px;line-height:1}

  .tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;
    color:var(--amberInk);background:var(--amberBg);border:1px solid var(--amberBorder);
    padding:3px 10px;border-radius:999px;margin-bottom:14px;font-weight:600}
  .q{font-size:22px;line-height:1.5;margin-bottom:22px}
  .gap{display:inline-block;min-width:74px;border-bottom:2.5px solid var(--amberInk);
    text-align:center;color:var(--amberInk);font-weight:700}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{background:var(--panel2);border:1.5px solid var(--line);color:var(--txt);
    padding:15px 18px;text-align:left;width:100%;font-size:17px}
  .opt:hover:not(:disabled){border-color:var(--amberInk)}
  .opt:disabled{cursor:default}
  .opt.ok{border-color:var(--green);background:var(--okBg)}
  .opt.no{border-color:var(--red);background:var(--noBg)}

  /* bet */
  .bet{display:flex;align-items:center;gap:9px;margin-bottom:16px;flex-wrap:wrap}
  .bet .lbl{font-size:13px;color:var(--dim)}
  .betbtn{background:var(--panel2);border:1.5px solid var(--line);color:var(--dim);
    padding:7px 15px;font-size:14px;font-weight:600}
  .betbtn.on{border-color:var(--purple);color:var(--purple);background:var(--purpleBg)}

  /* comma / find sentence */
  .sent{font-size:21px;line-height:2.3;margin-bottom:22px;user-select:none}
  .w{display:inline-block}
  .w.clk{cursor:pointer;border-radius:6px;padding:1px 4px}
  .w.clk:hover{background:var(--panel2)}
  .w.hit{background:var(--hitBg);box-shadow:inset 0 -2px 0 var(--red)}
  .w.good{background:var(--goodBg);box-shadow:inset 0 -2px 0 var(--green)}
  .slot{display:inline-block;width:16px;text-align:center;cursor:pointer;
    color:transparent;border-radius:5px;position:relative;font-weight:700}
  .slot:before{content:"·";color:var(--dot);font-size:20px;position:absolute;
    left:50%;transform:translateX(-50%);top:-2px}
  .slot:hover:before{color:var(--amberInk)}
  .slot.set{color:var(--amberInk)}
  .slot.set:before{content:""}
  .slot.miss{background:var(--hitBg)}
  .slot.miss:before{content:"?";color:var(--red);font-size:14px}
  .slot.right{color:var(--green)}
  .slot.right:before{content:""}
  .slot.wrong{color:var(--red);text-decoration:line-through}
  .slot.wrong:before{content:""}

  /* feedback */
  .fb{border-radius:12px;padding:16px 18px;margin-top:18px;border:1px solid;font-size:16px}
  .fb.ok{border-color:var(--okBorder);background:var(--okBg)}
  .fb.no{border-color:var(--noBorder);background:var(--noBg)}
  .fb .hd{font-weight:700;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
  .fb .pts{font-family:ui-monospace,monospace}
  .fb a{color:var(--amberInk);cursor:pointer;text-decoration:underline;font-size:14px}

  /* algorithm */
  .algo{counter-reset:s;margin:14px 0 0;padding:0;list-style:none}
  .algo li{counter-increment:s;position:relative;padding:11px 0 11px 44px;
    border-left:2px solid var(--line);margin-left:14px;font-size:15.5px;line-height:1.6}
  .algo li:before{content:counter(s);position:absolute;left:-15px;top:11px;
    width:28px;height:28px;border-radius:50%;background:var(--panel2);
    border:2px solid var(--amberInk);color:var(--amberInk);font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center}
  .algo li:last-child{border-left-color:transparent}
  .idea{font-style:italic;color:var(--dim);border-left:3px solid var(--amberInk);
    padding-left:14px;margin:0 0 6px;font-size:15px}
  details{margin-bottom:10px}
  summary{cursor:pointer;padding:13px 16px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;font-weight:600;list-style:none;box-shadow:var(--shadow)}
  summary::-webkit-details-marker{display:none}
  summary:before{content:"▸ ";color:var(--amberInk)}
  details[open] summary:before{content:"▾ "}
  details[open] summary{border-radius:12px 12px 0 0;border-bottom:none}
  .dbody{background:var(--panel);border:1px solid var(--line);border-top:none;
    border-radius:0 0 12px 12px;padding:4px 18px 18px}

  /* results */
  .big{font-size:56px;font-weight:800;text-align:center;font-family:ui-monospace,monospace;
    line-height:1.1;margin:6px 0}
  .rlist{margin:16px 0 0;padding:0;list-style:none}
  .rlist li{padding:9px 0;border-top:1px solid var(--line);font-size:15px;
    display:flex;justify-content:space-between;gap:12px}

  /* duel */
  .duel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .pl{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .pl.act{border-color:var(--amberInk)}
  .pl b{display:block;font-size:26px;font-family:ui-monospace,monospace}
  .pl span{font-size:13px;color:var(--dim)}
  .hide{display:none}

  /* переключатель темы */
  .hd-right{display:flex;align-items:center;gap:8px;flex:none}
  .theme{background:var(--panel);border:1px solid var(--line);border-radius:999px;
    width:34px;height:34px;font-size:15px;line-height:1;color:var(--dim);
    display:flex;align-items:center;justify-content:center;flex:none}
  .theme:hover{color:var(--txt);border-color:var(--amberInk)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><div class="flag"></div><div>
      <h1>Русский: пит-стоп</h1>
      <div class="muted" id="sub">20 минут в день</div>
    </div></div>
    <div class="hd-right">
      <div class="streak" id="streak">🔥 0</div>
      <button class="theme" id="theme" title="Сменить тему" aria-label="Сменить тему">☾</button>
    </div>
  </header>
  <div id="app"></div>
</div>

<script>
/* тема: светлая по умолчанию, выбор запоминается */
(function(){
  var K = 'rus_theme';
  var saved = null;
  try{ saved = localStorage.getItem(K); }catch(e){}
  if(saved === 'dark') document.documentElement.setAttribute('data-theme','dark');
  window.__toggleTheme = function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme','dark');
    try{ localStorage.setItem(K, dark ? 'light' : 'dark'); }catch(e){}
    var b = document.getElementById('theme');
    if(b) b.textContent = dark ? '☾' : '☀';
  };
})();
</script>
<script>
/*DATA*/

/* ============ ХРАНИЛИЩЕ ============ */
const KEY = 'rus_pitstop_v1';
let mem = {};
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return mem[KEY] || null; } },
  set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){ mem[KEY] = v; } }
};
const DAY = 86400000;
const today = () => Math.floor(Date.now() / DAY);

let S = store.get() || { cards:{}, pts:0, streak:0, lastDay:null, done:0, right:0, hist:[] };
CARDS.forEach((c,i)=>{ if(!S.cards[i]) S.cards[i] = {box:0, due:0, seen:0, err:0}; });
function save(){ store.set(S); }

/* стрик */
(function(){
  const t = today();
  if(S.lastDay === null){ /* ещё не занимался */ }
  else if(t - S.lastDay > 1){ S.streak = 0; save(); }
})();

/* интервалы Лейтнера, в днях */
const IVL = [0, 1, 2, 4, 8, 16, 30];

function dueCards(){
  const t = today();
  return CARDS.map((c,i)=>i).filter(i => S.cards[i].due <= t);
}
function newCards(){ return CARDS.map((c,i)=>i).filter(i => S.cards[i].seen === 0); }

/* ============ УТИЛИТЫ ============ */
const $ = s => document.querySelector(s);
const app = () => $('#app');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}
function renderStreak(){ $('#streak').textContent = '🔥 ' + S.streak; }
(function(){
  var b = document.getElementById('theme');
  if(!b) return;
  b.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀' : '☾';
  b.onclick = window.__toggleTheme;
})();

/* ============ ГЛАВНЫЙ ЭКРАН ============ */
function home(){
  renderStreak();
  const due = dueCards().length, fresh = newCards().length;
  const acc = S.done ? Math.round(S.right / S.done * 100) : 0;

  // прогресс по правилам: доля карточек в коробке >= 3
  const byRule = {};
  CARDS.forEach((c,i)=>{
    const r = c.r; byRule[r] = byRule[r] || {tot:0, ok:0};
    byRule[r].tot++;
    byRule[r].ok += Math.min(S.cards[i].box, 3) / 3;
  });

  app().innerHTML = `
  <div class="stats">
    <div class="stat"><b>${due}</b><span>к повтору</span></div>
    <div class="stat"><b>${S.pts}</b><span>очков</span></div>
    <div class="stat"><b>${acc}%</b><span>точность</span></div>
  </div>

  <button class="btn" id="go">${due ? 'Тренировка — ' + Math.min(due,20) + ' ' + plural(Math.min(due,20),'карточка','карточки','карточек') : 'Всё повторено! Взять новые'}</button>
  <button class="btn sec" id="blitz">⚡ Блиц: 10 карточек на скорость</button>
  <button class="btn sec" id="duel">🏁 Дуэль с папой</button>

  <div class="panel">
    <h2>Карта правил</h2>
    <div class="muted" style="margin-bottom:14px">Зелёная полоса — правило закрыто. Нажми, чтобы открыть алгоритм.</div>
    <div class="map">
      ${Object.keys(RULES).map(r=>{
        const d = byRule[r] || {tot:1, ok:0};
        const p = Math.round(d.ok / d.tot * 100);
        return `<div class="maprow" data-r="${r}">
          <div class="nm">${RULES[r].name}</div>
          <div class="bar"><i style="width:${p}%"></i></div>
          <div class="pct">${p}%</div>
        </div>`;
      }).join('')}
    </div>
  </div>

  <button class="btn sec" id="rules">📐 Все алгоритмы</button>
  <div class="muted" style="text-align:center;margin-top:22px">
    Всего карточек: ${CARDS.length} · новых: ${fresh}<br>
    <span id="reset" style="cursor:pointer;text-decoration:underline">сбросить прогресс</span>
  </div>`;

  $('#go').onclick = () => startSession('train');
  $('#blitz').onclick = () => startSession('blitz');
  $('#duel').onclick = () => startSession('duel');
  $('#rules').onclick = () => rulesScreen();
  document.querySelectorAll('.maprow').forEach(el=>{
    el.onclick = () => rulesScreen(el.dataset.r);
  });
  $('#reset').onclick = () => {
    if(confirm('Стереть весь прогресс?')){
      S = { cards:{}, pts:0, streak:0, lastDay:null, done:0, right:0, hist:[] };
      CARDS.forEach((c,i)=>{ S.cards[i] = {box:0, due:0, seen:0, err:0}; });
      save(); home();
    }
  };
}

/* ============ ЭКРАН ПРАВИЛ ============ */
function rulesScreen(openId){
  app().innerHTML = `
  <button class="btn sec sm" id="back" style="margin-bottom:16px">← Назад</button>
  <h2 style="margin-bottom:6px">Алгоритмы</h2>
  <div class="muted" style="margin-bottom:18px">Каждое правило — дерево решений. Идёшь по шагам сверху вниз, первое совпадение даёт ответ.</div>
  ${Object.keys(RULES).map(r=>`
    <details ${r===openId?'open':''} id="d_${r}">
      <summary>${RULES[r].name}</summary>
      <div class="dbody">
        <p class="idea">${RULES[r].idea}</p>
        <ol class="algo">${RULES[r].steps.map(s=>`<li>${s}</li>`).join('')}</ol>
      </div>
    </details>`).join('')}`;
  $('#back').onclick = home;
  if(openId){ const el = $('#d_'+openId); if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'center'}); }
}

/* ============ СЕССИЯ ============ */
let SES = null;

function startSession(mode){
  let ids;
  if(mode === 'train'){
    const due = dueCards();
    ids = due.length ? shuffle(due).slice(0,20) : shuffle(CARDS.map((c,i)=>i)).slice(0,20);
  } else if(mode === 'blitz'){
    ids = shuffle(CARDS.map((c,i)=>i)).slice(0,10);
  } else {
    ids = shuffle(CARDS.map((c,i)=>i)).slice(0,12);
  }
  SES = { mode, ids, i:0, right:0, pts:0, bet:1, wrong:[], scores:[0,0], turn:0 };
  step();
}

function endSession(){
  const t = today();
  if(S.lastDay !== t){
    S.streak = (S.lastDay === t - 1) ? S.streak + 1 : 1;
    S.lastDay = t;
  }
  save();
  results();
}

function step(){
  if(SES.i >= SES.ids.length){ endSession(); return; }
  const id = SES.ids[SES.i];
  const c = CARDS[id];
  SES.bet = 1;

  const pr = Math.round(SES.i / SES.ids.length * 100);
  const duelBar = SES.mode === 'duel' ? `
    <div class="duel">
      <div class="pl ${SES.turn===0?'act':''}"><b>${SES.scores[0]}</b><span>Сын</span></div>
      <div class="pl ${SES.turn===1?'act':''}"><b>${SES.scores[1]}</b><span>Папа</span></div>
    </div>` : '';

  let body = '';
  if(c.t === 'choice' || c.t === 'theory'){
    const q = c.t === 'choice'
      ? esc(c.q).replace('___','<span class="gap" id="gapv">?</span>')
      : esc(c.q);
    body = `<div class="q">${q}</div>
      <div class="opts">${shuffleOpts(c).map(o=>
        `<button class="opt" data-i="${o.i}">${esc(o.txt)}</button>`).join('')}</div>`;
  } else if(c.t === 'comma'){
    body = `<div class="muted" style="margin-bottom:10px">Нажми на точки там, где нужны запятые. Если запятых нет — сразу «Проверить».</div>
      <div class="sent" id="sent">${c.w.map((w,i)=>
        `<span class="w">${esc(w)}</span>${i < c.w.length-1 ? `<span class="slot" data-s="${i}"></span> ` : ''}`).join('')}</div>
      <button class="btn" id="check">Проверить</button>`;
  } else if(c.t === 'find'){
    body = `<div class="muted" style="margin-bottom:10px">В предложении одна ошибка. Нажми на неверное слово.</div>
      <div class="sent" id="sent">${c.w.map((w,i)=>
        `<span class="w clk" data-w="${i}">${esc(w)}</span> `).join('')}</div>`;
  }

  app().innerHTML = `
  <div class="top">
    <button class="xbtn" id="quit">✕</button>
    <div class="prog"><i style="width:${pr}%"></i></div>
    <div class="muted" style="font-family:ui-monospace,monospace">${SES.i+1}/${SES.ids.length}</div>
  </div>
  ${duelBar}
  <div class="panel">
    <span class="tag">${RULES[c.r].name}</span>
    ${SES.mode !== 'duel' ? `<div class="bet">
      <span class="lbl">Ставка:</span>
      <button class="betbtn on" data-b="1">×1</button>
      <button class="betbtn" data-b="2">×2 — уверен</button>
    </div>` : ''}
    ${body}
    <div id="fb"></div>
  </div>`;

  $('#quit').onclick = () => { if(confirm('Выйти из сессии?')) home(); };
  document.querySelectorAll('.betbtn').forEach(b=>{
    b.onclick = () => {
      SES.bet = +b.dataset.b;
      document.querySelectorAll('.betbtn').forEach(x=>x.classList.toggle('on', x === b));
    };
  });

  if(c.t === 'choice' || c.t === 'theory'){
    document.querySelectorAll('.opt').forEach(b=>{
      b.onclick = () => answerChoice(id, +b.dataset.i, b);
    });
  } else if(c.t === 'comma'){
    document.querySelectorAll('.slot').forEach(s=>{
      s.onclick = () => { s.classList.toggle('set'); s.textContent = s.classList.contains('set') ? ',' : ''; };
    });
    $('#check').onclick = () => answerComma(id);
  } else if(c.t === 'find'){
    document.querySelectorAll('.w.clk').forEach(w=>{
      w.onclick = () => answerFind(id, +w.dataset.w);
    });
  }
}

/* перемешать варианты, сохранив индекс правильного */
function shuffleOpts(c){
  const arr = c.o.map((txt,i)=>({txt, i}));
  return shuffle(arr);
}

function answerChoice(id, picked, btn){
  const c = CARDS[id];
  const ok = picked === c.a;
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled = true;
    if(+b.dataset.i === c.a) b.classList.add('ok');
    else if(b === btn) b.classList.add('no');
  });
  if(c.t === 'choice'){
    const g = $('#gapv');
    if(g){ g.textContent = c.o[c.a]; g.style.color = ok ? 'var(--green)' : 'var(--amberInk)'; }
  }
  finish(id, ok);
}

function answerComma(id){
  const c = CARDS[id];
  const picked = [...document.querySelectorAll('.slot')].filter(s=>s.classList.contains('set')).map(s=>+s.dataset.s);
  const need = c.a;
  const ok = picked.length === need.length && picked.every(p=>need.includes(p));
  document.querySelectorAll('.slot').forEach(s=>{
    const i = +s.dataset.s, set = s.classList.contains('set'), req = need.includes(i);
    s.classList.remove('set');
    if(set && req){ s.classList.add('right'); s.textContent = ','; }
    else if(set && !req){ s.classList.add('wrong'); s.textContent = ','; }
    else if(!set && req){ s.classList.add('miss'); }
    s.style.pointerEvents = 'none';
  });
  $('#check').style.display = 'none';
  finish(id, ok);
}

function answerFind(id, picked){
  const c = CARDS[id];
  const ok = picked === c.a;
  document.querySelectorAll('.w.clk').forEach(w=>{
    const i = +w.dataset.w;
    w.style.pointerEvents = 'none';
    if(i === c.a) w.classList.add('good');
    else if(i === picked) w.classList.add('hit');
  });
  finish(id, ok);
}

/* ============ ИТОГ ПО КАРТОЧКЕ ============ */
function finish(id, ok){
  const c = CARDS[id], st = S.cards[id];
  st.seen++;
  if(ok){ st.box = Math.min(st.box + 1, IVL.length - 1); }
  else { st.box = 0; st.err++; }
  st.due = today() + IVL[st.box];

  S.done++; if(ok) S.right++;

  let pts = 0;
  if(SES.mode === 'duel'){
    if(ok) SES.scores[SES.turn] += 10;
  } else {
    pts = ok ? 10 * SES.bet : -5 * (SES.bet - 1);
    S.pts = Math.max(0, S.pts + pts);
    SES.pts += pts;
  }
  if(ok) SES.right++; else SES.wrong.push(id);
  save();

  const fixLine = c.t === 'find' ? ` Правильно: <b>${esc(c.fix)}</b>.` : '';
  const ptsTxt = SES.mode === 'duel' ? '' :
    `<span class="pts">${pts > 0 ? '+' + pts : pts}</span>`;
  const head = ok
    ? (SES.bet === 2 ? 'Верно ×2' : 'Верно')
    : (SES.bet === 2 ? 'Мимо — и ставка была двойная' : 'Не то');

  $('#fb').innerHTML = `
    <div class="fb ${ok?'ok':'no'}">
      <div class="hd"><span>${head}</span>${ptsTxt}</div>
      <div>${c.e}${fixLine}</div>
      ${!ok ? `<div style="margin-top:9px"><a id="showAlgo">Показать алгоритм: ${RULES[c.r].name} →</a></div>
        <div id="algoBox" class="hide" style="margin-top:10px">
          <p class="idea">${RULES[c.r].idea}</p>
          <ol class="algo">${RULES[c.r].steps.map(s=>`<li>${s}</li>`).join('')}</ol>
        </div>` : ''}
    </div>
    <button class="btn" id="next" style="margin-top:14px">${SES.i+1 >= SES.ids.length ? 'Итоги' : 'Дальше →'}</button>`;

  if(!ok){
    $('#showAlgo').onclick = () => {
      const b = $('#algoBox');
      b.classList.toggle('hide');
      $('#showAlgo').textContent = b.classList.contains('hide')
        ? 'Показать алгоритм: ' + RULES[c.r].name + ' →'
        : 'Свернуть алгоритм';
    };
  }
  $('#next').onclick = () => { SES.i++; if(SES.mode === 'duel') SES.turn = 1 - SES.turn; step(); };
  const nx = $('#next');
  if(nx && nx.scrollIntoView) nx.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ============ РЕЗУЛЬТАТЫ ============ */
function results(){
  renderStreak();
  const n = SES.ids.length, acc = Math.round(SES.right / n * 100);

  if(SES.mode === 'duel'){
    const [a,b] = SES.scores;
    const win = a > b ? 'Победил сын 🏆' : b > a ? 'Победил папа 🏆' : 'Ничья';
    app().innerHTML = `
      <div class="panel" style="text-align:center">
        <h2>${win}</h2>
        <div class="duel" style="margin-top:16px">
          <div class="pl"><b>${a}</b><span>Сын</span></div>
          <div class="pl"><b>${b}</b><span>Папа</span></div>
        </div>
      </div>
      <button class="btn" id="again">Ещё раз</button>
      <button class="btn sec" id="home">На главную</button>`;
    $('#again').onclick = () => startSession('duel');
    $('#home').onclick = home;
    return;
  }

  const weak = {};
  SES.wrong.forEach(id=>{ const r = CARDS[id].r; weak[r] = (weak[r]||0)+1; });
  const weakList = Object.keys(weak).sort((x,y)=>weak[y]-weak[x]);

  app().innerHTML = `
  <div class="panel" style="text-align:center">
    <div class="muted">точность</div>
    <div class="big" style="color:${acc>=80?'var(--green)':acc>=50?'var(--amberInk)':'var(--red)'}">${acc}%</div>
    <div class="muted">${SES.right} из ${n} · ${SES.pts >= 0 ? '+' : ''}${SES.pts} ${plural(Math.abs(SES.pts),'очко','очка','очков')} · 🔥 ${S.streak} ${plural(S.streak,'день','дня','дней')}</div>
  </div>
  ${weakList.length ? `<div class="panel">
    <h2>Куда смотреть</h2>
    <ul class="rlist">${weakList.map(r=>
      `<li><span>${RULES[r].name}</span><span class="muted">${weak[r]} ${plural(weak[r],'ошибка','ошибки','ошибок')}</span></li>`).join('')}</ul>
    <button class="btn sec sm" id="fix" style="margin-top:14px">Разобрать алгоритмы</button>
  </div>` : `<div class="panel" style="text-align:center">Ни одной ошибки. Правила закрыты.</div>`}
  <button class="btn" id="more">Ещё сессия</button>
  <button class="btn sec" id="home">На главную</button>`;

  if(weakList.length) $('#fix').onclick = () => rulesScreen(weakList[0]);
  $('#more').onclick = () => startSession(SES.mode);
  $('#home').onclick = home;
}

home();
</script>
